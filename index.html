<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Expense Tracker</title><style>:root{--a:#22c55e}*{box-sizing:border-box}body{margin:0;background:#08090d;color:#f7f8fb;font:15px Inter,system-ui,sans-serif}header{position:sticky;top:0;background:#08090dee;backdrop-filter:blur(12px);border-bottom:1px solid #282e38;padding:16px 5vw;display:flex;justify-content:space-between;gap:20px;align-items:center}.brand{color:white;text-decoration:none;font-weight:900}.brand small{display:block;color:#7f8999;font-size:10px}nav{display:flex;gap:6px;flex-wrap:wrap}nav a{color:#98a2b2;text-decoration:none;padding:9px 12px;border-radius:9px}nav a:hover{background:var(--a);color:#fff}main{max-width:1180px;margin:auto;padding:60px 5vw}h1{font-size:clamp(44px,7vw,82px);line-height:.95;letter-spacing:-.06em;margin:0 0 15px}p{color:#9ca5b4;line-height:1.7}.heroimg{height:190px;border-radius:18px;background:linear-gradient(135deg,var(--a),#151922);display:grid;place-items:center;font-size:70px;margin:25px 0}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin:28px 0}.grid>div,.card,.balance{background:#0f1218;border:1px solid #29303a;border-radius:16px;padding:20px}.grid b,.balance b{display:block;font-size:30px;margin-top:9px}.list{border:1px solid #29303a;border-radius:16px;overflow:hidden;margin-top:18px}.list>div{padding:15px 18px;border-bottom:1px solid #252b34;display:flex;justify-content:space-between;gap:12px}.chart{height:270px;display:flex;align-items:end;gap:7px;margin:25px 0}.chart i{flex:1;background:var(--a);border-radius:5px 5px 0 0}button{border:0;background:var(--a);color:#fff;padding:10px 14px;border-radius:9px;font-weight:800;cursor:pointer;margin:5px 4px 5px 0}input,select{display:block;width:100%;background:#0a0d12;border:1px solid #303744;color:#fff;border-radius:9px;padding:11px;margin:7px 0 14px}@media(max-width:760px){header{flex-direction:column;align-items:flex-start}.grid{grid-template-columns:1fr}main{padding:40px 5vw}}</style></head><body><header><a class="brand" href="?view=0">◉ Expense Tracker<small>LOCAL DEMO · NO DATABASE</small></a><nav><a href="?view=0">Dashboard</a><a href="?view=1">Transactions</a><a href="?view=2">Categories</a><a href="?view=3">Reports</a></nav></header><main id="app"></main><script>let d=JSON.parse(localStorage.expenses||'[]');const money=n=>'Rp '+Number(n).toLocaleString('id-ID');function render(){let v=+(new URLSearchParams(location.search).get('view')||0),c={};d.forEach(x=>c[x.cat]=(c[x.cat]||0)+x.amt);let body=v===0?'<h1>Control every rupiah.</h1><p>Tambah, hapus, dan analisis pengeluaran tanpa database.</p><div class="grid"><div><small>TOTAL</small><b>'+money(d.reduce((a,x)=>a+x.amt,0))+'</b></div><div><small>TRANSACTIONS</small><b>'+d.length+'</b></div><div><small>TOP CATEGORY</small><b>'+(Object.keys(c).sort((a,b)=>c[b]-c[a])[0]||'—')+'</b></div></div><form onsubmit="return addE(event)"><input id="desc" placeholder="Description" required><input id="amt" type="number" min="1" placeholder="Amount" required><select id="cat"><option>Food</option><option>Transport</option><option>Bills</option><option>Shopping</option><option>Other</option></select><button>Add expense</button></form>':v===1?'<h1>Transactions</h1>'+rows():v===2?'<h1>Categories</h1><div class="grid">'+Object.entries(c).map(([k,x])=>'<div><small>'+k+'</small><b>'+money(x)+'</b></div>').join('')+'</div>':'<h1>Reports</h1><div class="chart">'+Object.entries(c).map(([k,x])=>'<i style="height:'+Math.max(8,x/Math.max(...Object.values(c),1)*100)+'%" title="'+k+'"></i>').join('')+'</div><button onclick="window.print()">Print</button>';app.innerHTML=body}function rows(){return '<section class="list">'+d.map(x=>'<div><span>'+x.desc+' · '+x.cat+'</span><span>'+money(x.amt)+' <button onclick="delE('+x.id+')">×</button></span></div>').join('')+'</section>'}function addE(e){e.preventDefault();d.unshift({id:Date.now(),desc:desc.value,amt:+amt.value,cat:cat.value});localStorage.expenses=JSON.stringify(d);location.reload();return false}function delE(id){d=d.filter(x=>x.id!==id);localStorage.expenses=JSON.stringify(d);location.reload()}render();</script></body></html>
